spring.application.name=insightblog

# MySQL config
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:blog_app}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Root@1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

# NLP Python service URL
nlp.service.url=${NLP_SERVICE_URL:http://localhost:8000}

# Moderation threshold (0.0 - 1.0) — content with toxicity above this is blocked
moderation.toxicity.threshold=0.7

# Logging (from new repo integration)
logging.level.root=INFO
logging.level.com.blog.insightblog=DEBUG

# Swagger UI config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
